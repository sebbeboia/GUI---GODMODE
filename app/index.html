<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PWNBOARD — Pentest Command HUD</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#050a12">

  <!-- Design-system stylesheet: tokens, component classes, fonts (JetBrains Mono / Inter), keyframes. -->
  <link rel="stylesheet" href="vendor/pwnboard-ui/_ds_bundle.css">

  <style>
    /* Global glue ported verbatim from the PWNBOARD design's helmet block. */
    html { color-scheme: dark; }
    html, body { margin: 0; background: #050a12; }
    * { box-sizing: border-box; }
    body { touch-action: manipulation; }
    #root { min-height: 100vh; }

    /* Skip link: off-screen until keyboard focus, then pinned top-left. */
    .skip-link {
      position: absolute; left: 8px; top: -60px; z-index: 100;
      padding: 8px 14px; background: #00d4ff; color: #04080e;
      font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px;
      transition: top .15s;
    }
    .skip-link:focus { top: 8px; color: #04080e; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #050a12; }
    ::-webkit-scrollbar-thumb { background: #12293a; border-radius: 0; }
    ::-webkit-scrollbar-thumb:hover { background: #00d4ff; }

    a { color: #00d4ff; text-decoration: none; }
    a:hover { color: #5fe4ff; }

    input.pwn-native {
      background: #04080e; border: 1px solid #16283a; color: #c0d0e0;
      font-family: 'JetBrains Mono', monospace;
    }
    input.pwn-native:focus-visible { border-color: #00d4ff; outline: 2px solid #00d4ff; outline-offset: 1px; }

    select.pwn-native {
      background: #04080e; border: 1px solid #16283a; color: #c0d0e0;
      font-family: 'JetBrains Mono', monospace; padding: 8px 10px; font-size: 12px;
    }
    select.pwn-native:focus-visible { border-color: #00d4ff; outline: 2px solid #00d4ff; outline-offset: 1px; }

    /* Tool-launcher card hover (the design's `style-hover` behaviour, as real CSS).
       Inline styles set the base; !important lets the hover win over them. */
    .pwn-tool:hover {
      border-color: #00d4ff !important;
      transform: translateY(-2px);
      background: linear-gradient(160deg, #0d1826, #08101b) !important;
    }

    /* Visible keyboard-focus ring for the custom (non-native) interactive
       elements: nav items, tool cards, OSINT modules, and toggles. */
    .pwn-clickable:focus-visible {
      outline: 2px solid #00d4ff;
      outline-offset: 2px;
    }

    /* Respect reduced-motion: near-disable the design-system keyframe
       animations (spinner, waveform, arc reactor) and all transitions. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <div id="root"></div>

  <!-- React must be on the page before the design-system bundle (it reads window.React). -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/pwnboard-ui/_ds_bundle.js"></script>

  <!-- The PWNBOARD app (compiled from src/app.jsx). -->
  <script src="app.js"></script>
</body>
</html>
